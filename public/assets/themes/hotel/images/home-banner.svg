<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="homeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34a19f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5c54;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#homeGradient)"/>
  <g opacity="0.15">
    <circle cx="100" cy="50" r="60" fill="#ffffff"/>
    <circle cx="1100" cy="350" r="80" fill="#ffffff"/>
    <rect x="300" y="150" width="100" height="100" fill="#ffffff"/>
  </g>
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">Welcome to Our Hotel</text>
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" opacity="0.9">Luxury Accommodation & Hospitality</text>
</svg>